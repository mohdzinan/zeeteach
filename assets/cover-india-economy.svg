<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">India’s changing economy</title>
  <desc id="desc">A connected landscape of farms, renewable energy, industry, transport, and a modern Indian city.</desc>
  <defs>
