    <linearGradient id="road" x2="1" y2="0"><stop stop-color="#d4a574"/><stop offset="1" stop-color="#efd9b9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#24372a" flood-opacity=".14"/></filter>
  </defs>
