<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">India’s economic timeline</title><desc id="desc">Three eras: colonial economy, planned development, and reforms since 1991.</desc>
  <rect width="1200" height="760" rx="40" fill="#f2f5ef"/><path d="M140 380h920" stroke="#4a7c9e" stroke-width="18" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#2c3e50"><circle cx="230" cy="380" r="38" fill="#d4a574" stroke="#2d5016" stroke-width="8"/><circle cx="600" cy="380" r="38" fill="#4a7c9e" stroke="#2d5016" stroke-width="8"/><circle cx="970" cy="380" r="38" fill="#2d5016" stroke="#2d5016" stroke-width="8"/>
  <g><rect x="85" y="145" width="290" height="165" rx="24" fill="#fff" stroke="#d4a574" stroke-width="6"/><path d="M175 240h110M195 215h70M210 190h40" stroke="#8b7355" stroke-width="12" stroke-linecap="round"/><text x="230" y="282" font-size="27" font-weight="700">Colonial economy</text><text x="230" y="480" font-size="30" font-weight="700">Before 1947</text><text x="230" y="525" font-size="22">Extraction and deindustrialization</text></g>
  <g><rect x="455" y="145" width="290" height="165" rx="24" fill="#fff" stroke="#4a7c9e" stroke-width="6"/><path d="M535 250v-55l65-35 65 35v55M560 250v-38h80v38" fill="#dbe9ee" stroke="#4a7c9e" stroke-width="6"/><text x="600" y="282" font-size="27" font-weight="700">Planned development</text><text x="600" y="480" font-size="30" font-weight="700">1947–1990</text><text x="600" y="525" font-size="22">Five-year plans and public sector</text></g>
  <g><rect x="825" y="145" width="290" height="165" rx="24" fill="#fff" stroke="#2d5016" stroke-width="6"/><path d="M900 250h140M920 225h100M940 200h60" stroke="#2d5016" stroke-width="12" stroke-linecap="round"/><text x="970" y="282" font-size="27" font-weight="700">Economic reforms</text><text x="970" y="480" font-size="30" font-weight="700">1991 onward</text><text x="970" y="525" font-size="22">Liberalization and global links</text></g></g>
</svg>
