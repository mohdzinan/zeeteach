<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Economic reform framework</title><desc id="desc">Liberalization, privatization, and globalization linked as three policy levers.</desc>
  <rect width="1200" height="760" rx="8" fill="#eef4f7"/><circle cx="600" cy="380" r="125" fill="#2d5016"/><text x="600" y="370" font-family="Arial,sans-serif" font-size="35" font-weight="700" text-anchor="middle" fill="white">1991</text><text x="600" y="420" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#fff">Reform era</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#2c3e50"><path d="M485 330 340 230M715 330 860 230M600 505v90" stroke="#d4a574" stroke-width="15" stroke-linecap="round"/>
  <rect x="100" y="105" width="380" height="200" rx="8" fill="#fff" stroke="#4a7c9e" stroke-width="8"/><circle cx="290" cy="170" r="35" fill="#b8d0dc"/><path d="M270 170h40m-20-20v40" stroke="#2d5016" stroke-width="8" stroke-linecap="round"/><text x="290" y="240" font-size="34" font-weight="700">Liberalization</text><text x="290" y="278" font-size="21">Reduce barriers and controls</text>
  <rect x="720" y="105" width="380" height="200" rx="8" fill="#fff" stroke="#d4a574" stroke-width="8"/><circle cx="910" cy="170" r="35" fill="#efd9b9"/><path d="M890 185v-25h40v25m-45 0h50" stroke="#2d5016" stroke-width="7"/><text x="910" y="240" font-size="34" font-weight="700">Privatization</text><text x="910" y="278" font-size="21">Expand private participation</text>
  <rect x="410" y="585" width="380" height="145" rx="8" fill="#fff" stroke="#2d5016" stroke-width="8"/><circle cx="600" cy="630" r="27" fill="#c8d8bb"/><path d="M577 630h46m-23-23v46" stroke="#2d5016" stroke-width="7"/><text x="600" y="690" font-size="32" font-weight="700">Globalization</text></g>
</svg>
